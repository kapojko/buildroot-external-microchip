# MediCam: identify the DHCP client by MAC, not by DUID.
#
# systemd-networkd's default DHCPv4 client identifier is a DUID that it derives
# from /etc/machine-id (nothing is stored in /var/lib/systemd/network/), so every
# SD rewrite presents the router with a *new* client even when the MAC - and
# therefore the hostname - is unchanged. Observed: after a reflash the board sat
# without an address for 4.5 minutes (carrier 09:03:43, lease 09:08:18) because
# the DHCP server still held the address for the previous client id.
#
# With ClientIdentifier=mac the lease follows the EEPROM MAC (medicam-identity),
# so reflashing no longer churns leases or renames the board in DNS.

[DHCPv4]
ClientIdentifier=mac
