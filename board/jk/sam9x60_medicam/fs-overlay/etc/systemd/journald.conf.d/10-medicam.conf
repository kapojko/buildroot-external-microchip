# MediCam: keep the journal in RAM.
#
# The device has 128 MiB of RAM and the rootfs lives on SD/NAND, so neither the
# cap nor the flash wear of a persistent journal is acceptable. Volatile means
# /run/log/journal (tmpfs): logs are lost on reboot, "journalctl -b" works.
[Journal]
Storage=volatile
RuntimeMaxUse=8M
RuntimeKeepFree=4M
