# MediCam: no autologin on the serial console - always ask for the password.
#
# The external tree carries patches/systemd/0002-package-systemd-add-autologin-
# as-root.patch, which changes the vendor serial-getty@.service to
#   ExecStart=-/sbin/agetty --autologin root -o '-p -- \\u' ...
# That is a Microchip convenience for all boards in this tree. The MediCam base
# image requires an authenticated console (PLAN decision "Auth"), so the
# ExecStart is reset here - an empty ExecStart= discards the inherited value -
# and redefined without --autologin. This is template-level, so every serial
# console instance (ttyS0 on the DBGU, ttyS2, ...) is covered.

[Service]
ExecStart=
ExecStart=-/sbin/agetty -o '-p -- \\u' --keep-baud 115200,57600,38400,9600 - $TERM
