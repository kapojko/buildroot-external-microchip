# Image for SAM9X60-Medicam NAND build (stage 2): SD card (rescue) + raw NAND
# image (production). Used by the sam9x60_medicam_nand_defconfig only; the
# SD-only sam9x60_medicam_defconfig uses genimage.cfg.
#
# Frozen NAND layout — must match at91-sam9x60_medicam.dts, uboot-env-nand.txt
# and flash-nand.sh:
#   0x000000  256 KiB   at91bootstrap (boot.bin.pmecc)
#   0x040000  768 KiB   u-boot
#   0x100000  256 KiB   uboot env (redundant copy)
#   0x140000  256 KiB   uboot env (primary copy)
#   0x180000  512 KiB   device tree
#   0x200000    8 MiB   kernel (zImage)
#   0xa00000   rest     UBI image (rootfs.ubifs) — sized to the 8 Gbit test bed
#                       die: 0xa00000..0x40000000 = 0x3f600000 (4056 PEB).
#                       For the 4 Gbit production part (same geometry): use
#                       0x1f600000 (2024 PEB) — see README "NAND layout".

image boot.vfat {
	vfat {
		files = {
			"zImage",
			"at91-sam9x60_medicam.dtb",
			"boot.bin",
			"boot.bin.pmecc",
			"u-boot.bin",
			"uboot-env.bin",
			"rootfs.ubifs"
		}

		file uboot.env {
			image = "uboot-env.bin"
		}
	}
	size = 256M
}

image sdcard.img {
	hdimage {
	}

	partition boot {
		partition-type = 0xC
		bootable = "true"
		image = "boot.vfat"
		offset = 1M
	}

	partition rootfs {
		partition-type = 0x83
		image = "rootfs.ext4"
	}
}

# Flash chip descriptor for the MT29F8G08ABACAWP (8 Gbit test bed) and the
# MT29F4G08ABACA-class production part — same geometry:
#   4 KiB page / 256 KiB eraseblock / OOB 224.
#   page size:     4 KiB = 0x1000  -> minimum-io-unit-size
#   sub-page:      512 B = 0x200   -> sub-page-size
#   UBI VID header at the start of each PEB after 2 sub-pages -> 0x200
#   erasesize:     256 KiB = 0x40000 -> pebsize, lebsize = 0x40000 - 2*0x1000
#   numpebs:       UBI region / 256 KiB
#                   8 Gbit: 0x3f600000 / 0x40000 = 4056
#                   4 Gbit: 0x1f600000 / 0x40000 = 2024
flash medicam-nand {
	pebsize             = 0x40000
	lebsize             = 0x3e000
	numpebs             = 4056
	minimum-io-unit-size = 0x1000
	sub-page-size       = 0x200
	vid-header-offset   = 0x200
}

# Raw NAND image: partition contents concatenated, padded to PEB boundaries.
# Not itself a UBI image: the boot ROM and U-Boot load raw data from the raw
# regions; only the ubi region is interpreted as UBI by the kernel.
image medicam-nand.img {
	flash {
	}
	flashtype = "medicam-nand"

	partition at91bootstrap {
		in-partition-table = false
		image = "boot.bin.pmecc"
		offset = 0x0
		size   = 0x40000
	}

	partition uboot {
		in-partition-table = false
		image = "u-boot.bin"
		offset = 0x40000
		size   = 0xc0000
	}

	partition ubootenvred {
		in-partition-table = false
		image = "uboot-env.bin"
		offset = 0x100000
		size   = 0x40000
	}

	partition ubootenv {
		in-partition-table = false
		image = "uboot-env.bin"
		offset = 0x140000
		size   = 0x40000
	}

	partition dtb {
		in-partition-table = false
		image = "at91-sam9x60_medicam.dtb"
		offset = 0x180000
		size   = 0x80000
	}

	partition kernel {
		in-partition-table = false
		image = "zImage"
		offset = 0x200000
		size   = 0x800000
	}

	partition ubi {
		in-partition-table = false
		image = "rootfs.ubifs"
		offset = 0xa00000
		size   = 0x3f600000
	}
}
