# Image for SAM9X60-Medicam: SD card (rescue) + raw NAND image (production).
#
# Used by the sam9x60_medicam_nand_defconfig only.
# The sam9x60_medicam_defconfig (SD-only) uses genimage.cfg instead.

image boot.vfat {
	vfat {
		files = {
			"zImage",
			"at91-sam9x60_medicam.dtb",
			"boot.bin",
			"boot.bin.pmecc",
			"u-boot.bin",
			"uboot-env.bin",
			"rootfs.ubifs"
		}

		file uboot.env {
			image = "uboot-env.bin"
		}
	}
	size = 256M
}

image sdcard.img {
	hdimage {
	}

	partition boot {
		partition-type = 0xC
		bootable = "true"
		image = "boot.vfat"
		offset = 1M
	}

	partition rootfs {
		partition-type = 0x83
		image = "rootfs.ext4"
	}
}

# Flash chip descriptor for the MT29F8G08ABACAWP (and the 128 MiB experiment
# board NAND — same erasesize/lebsize).
#
# Total size: 128 MiB = 0x8000000
#   erasesize: 256 KiB = 0x40000   -> numpebs = 128 MiB / 256 KiB = 512
#   page size: 4 KiB  = 0x1000     -> minimum-io-unit-size
#   sub-page:  512 B  = 0x200      -> sub-page-size
#   UBI VID header sits at the start of each PEB after 2 sub-pages:
#                                   -> vid-header-offset = 0x200
flash medicam-nand {
	pebsize             = 0x40000
	lebsize             = 0x3e000
	numpebs             = 512
	minimum-io-unit-size = 0x1000
	sub-page-size       = 0x200
	vid-header-offset   = 0x200
}

# Raw NAND image: partition contents concatenated, padded to PEB boundaries.
#
# Layout must match the DTS partitions and U-Boot mtdparts:
#   0x000000  256 KiB   at91bootstrap (boot.bin.pmecc)
#   0x040000  768 KiB   u-boot
#   0x100000  256 KiB   uboot env (redundant copy)
#   0x140000  256 KiB   uboot env (primary copy)
#   0x180000  512 KiB   device tree
#   0x200000    8 MiB   kernel (zImage)
#   0xa00000  118 MiB   UBI image (rootfs.ubifs)
#
# This image is *not* itself a UBI image: it is a raw, flat image that the
# operator writes into NAND with flash_eraseall + nandwrite (per partition) or
# dd'd into /dev/mtd0 (and re-formatting the UBI partition). The boot ROM and
# u-boot load binary data from these raw regions; only the rootfs region is
# interpreted as UBI by the kernel.
#
# Note: genimage "flash" image type does not add a UBI layout header — it just
#       concatenates the raw partition contents, padding each partition to its
#       size. UBI volume layout is only built when the partition image itself
#       is a UBI image (rootfs.ubifs produced by ubinize already contains the
#       layout headers).
image medicam-nand.img {
	flash {
	}
	flashtype = "medicam-nand"

	partition at91bootstrap {
		in-partition-table = false
		image = "boot.bin.pmecc"
		offset = 0x0
		size   = 0x40000
	}

	partition uboot {
		in-partition-table = false
		image = "u-boot.bin"
		offset = 0x40000
		size   = 0xc0000
	}

	partition ubootenvred {
		in-partition-table = false
		image = "uboot-env.bin"
		offset = 0x100000
		size   = 0x40000
	}

	partition ubootenv {
		in-partition-table = false
		image = "uboot-env.bin"
		offset = 0x140000
		size   = 0x40000
	}

	partition dtb {
		in-partition-table = false
		image = "at91-sam9x60_medicam.dtb"
		offset = 0x180000
		size   = 0x80000
	}

	partition kernel {
		in-partition-table = false
		image = "zImage"
		offset = 0x200000
		size   = 0x800000
	}

	partition rootfs {
		in-partition-table = false
		image = "rootfs.ubifs"
		offset = 0xa00000
		size   = 0x7600000
	}
}