# MediCam: mask the vendor home.conf tmpfiles rule.
#
# /usr/lib/tmpfiles.d/home.conf contains "Q /home 0755 - - -", i.e. "make /home a
# directory". This image has /home as a symlink to data/home (the persistent
# volume), so the rule conflicts with it and systemd-tmpfiles logs
#   "/home" already exists and is not a directory.
# at every boot. An identically named file in /etc/tmpfiles.d takes precedence
# over /usr/lib and is empty on purpose: the rule is simply not executed.
#
# The same conflict shows up once per build as a harmless makedevs message
# (system/device_table.txt has a "d /home" entry); see LOG_base_image.txt 7.11b.
